name: CI

# ============================================================
# چرا این فایل وجود دارد
# ============================================================
# تا امروز تنها workflow پروژه `security.yml` بود (gitleaks) و هیچ‌کدام از
# تست‌ها هیچ‌وقت خودکار اجرا نمی‌شدند. بجِ «tests passing» در README هم یک بجِ
# دستیِ shields.io بود که هیچ ربطی به وضعیتِ واقعیِ کد نداشت — یعنی می‌شد کد را
# بشکنی و بج سبز بماند.
#
# این workflow همان چیزی را اجرا می‌کند که خودت دستی اجرا می‌کنی:
#   • هفت مجموعه‌ی تستِ بک‌اند (هیچ‌کدام به `.env` یا دیتابیسِ واقعی نیاز ندارند)
#   • تایپ‌چک، لینت، تست و بیلدِ Next.js
#
# یک نکته‌ی مهم درباره‌ی تست‌ها: هر مجموعه روی **کپیِ** دیتابیس اجرا می‌شود
# (backend/tests/sandbox.js در پوشه‌ی موقتِ سیستم)، و روی یک checkout تازه که
# `backend/data` ندارد، سرورِ تست دیتابیس را از صفر می‌سازد و `lib/seed.js`
# محصولات را می‌کارد. پس CI به هیچ داده‌ی از پیش موجودی وابسته نیست.
# (همین وابستگی یک بار پنهان بود: تستِ بکاپ به پوشه‌ی واقعیِ مغازه نگاه می‌کرد
# و روی هر ماشینِ نو و روی CI قرمز می‌شد. باگ اینجا پیدا و رفع شد.)

on:
  push:
  pull_request:
  # تا بتوانی بدونِ commit هم دستی اجرا کنی
  workflow_dispatch:

permissions:
  contents: read

# اگر روی یک شاخه دو بار پشت‌سرهم push کنی، اجرای قدیمیِ بی‌فایده لغو می‌شود.
# بدونِ این، صفِ runnerها با اجراهای تکراری پر می‌شود.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # دو نسخه، و `fail-fast: false` تا اگر یکی قرمز شد نسخه‌ی دیگر هم اجرا شود:
    # آن‌وقت معلوم می‌شود مشکل از کد است یا از نسخه‌ی Node. تفاوتِ نسخه‌ها
    # دقیقاً چیزِ گران‌قیمتی است که اواخر معلوم می‌شود.
    #
    # چرا ۲۲ و ۲۴: `README` و `engines` می‌گویند «Node >= 22.5» و ۲۴ همان
    # نسخه‌ای است که توسعه روی آن انجام می‌شود. اگر کد ناخواسته روی نسخه‌ی
    # جدیدتر بیفتد، این ماتریس قبل از کاربر می‌فهمد.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ---------- هفت مجموعه‌ی تست ----------
      # هر کدام یک stepِ جدا: اگر یکی بشکند، در خلاصه‌ی اجرا مستقیم معلوم است
      # کدام مجموعه قرمز شده، نه اینکه یک لاگِ چندهزارخطی را بگردی.
      # ترتیب از سنگین‌ترین به سبک‌ترین است تا زودترین شکست، بیشترین وقت را
      # نجات دهد.

      - name: Smoke tests
        run: node test-smoke.js

      - name: SEO tests
        run: node test-seo.js

      - name: OWASP Top 10 scan
        run: node tests/owasp-scan.js

      - name: Security tests
        run: node tests/security.js

      - name: Discount tests
        run: node tests/discount.js

      - name: Benchmark report integrity
        run: node tests/bench-report-integrity.js

      - name: Secret boundary guard
        run: node tests/secrets.js

      # نگهبانِ حذفِ پنلِ Express: نه سرور می‌خواهد نه دیتابیس — فقط دیسک را
      # می‌خواند. چهارمی در دسته‌ی سبک‌ها است، پس با همان‌ها می‌آید.
      # (۴۰۴ِ زنده‌ی همان مسیرها در stepِ Smoke سنجیده می‌شود، نه اینجا.)
      - name: Retired panel guard
        run: node tests/panel-retired.js

      # سبک‌ترین آزمون (فقط خواندنِ سورس)، پس آخر می‌آید: چیزی نمی‌سنجد که
      # به سرور یا دیتابیس نیاز داشته باشد، ولی پنجره‌ی صبرِ فرانت‌اند را به
      # مهلتِ پرداخت و تیکِ تطبیقِ بک‌اند گره می‌زند.
      - name: Order window guard
        run: node tests/order-window-integrity.js

      # هم‌خانوادهٔ همان آزمونِ سبک، اما قفلِ دو طرفِ یک مهلت در **دو فرانت‌اند**
      # (Express و Next): ثانیه‌شمارِ ارسال مجدد باید «لحظه‌ی پایان» را ذخیره کند
      # و هر تیک از همان بازمحاسبه شود — نه با شمارندهٔ کاهنده‌ای که با خوابِ تب
      # از واقعیت عقب می‌ماند.
      - name: Resend window guard
        run: node tests/otp-resend-window.js

      # نه سرور می‌خواهد نه دیتابیس: عددهای README را با خودِ مخزن می‌سنجد. اگر
      # کسی عددی را عوض کند و شمارشِ مستندات جا بماند (که یک‌بار شد: سئو سه جا ۸۵
      # و یک جا ۸۶)، همین step گیر می‌اندازد — پیش از اینکه عددِ غلط عادت شود.
      - name: README count guard
        run: node tests/readme-counts.js

      # ---------- خودِ نگهبان‌ها ----------
      # هارنسِ تخریبی: برای هر نگهبانِ سبک چند خرابیِ عمدی می‌سازد و انتظار دارد
      # قرمز شود (و دلیلِ درست را بگوید)، بعد فایل را بایت‌به‌بایت برمی‌گرداند و
      # با SHA-256 تأیید می‌کند. بدونِ این، «سبزِ خالی» از «نگهبانِ خراب» قابلِ
      # تفکیک نیست — و نگهبانی که هیچ نمی‌گیرد از نبودنش بدتر است.
      - name: Guard mutation harness (backend guards)
        run: node tests/guard-mutations.js --scope=backend

  frontend:
    name: Next.js typecheck, lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    # همان ماتریسِ jobِ بک‌اند، با همان `fail-fast: false` و همان دلیل‌ها:
    # `engines` می‌گوید >=22.5 ولی توسعه روی ۲۴ انجام می‌شود، و اگر یکی قرمز شد
    # باید نسخه‌ی دیگر هم اجرا شود تا معلوم شود مشکل از کد است یا از Node.
    #
    # یک نکته که فقط مخصوصِ فرانت‌اند است: ابزارِ آزمونِ تازه کفِ نسخه‌ی خودش را
    # دارد — Vitest 5 روی `^22.12.0` و jsdom 30 روی `^22.22.2`. مقدارِ `22.x` در
    # setup-node آخرین ۲۲ را نصب می‌کند، پس اینجا قبول می‌شود؛ ولی توسعه‌دهنده‌ای
    # که روی ۲۲٫۵ باشد می‌تواند سایت را اجرا کند و **نمی‌تواند** `npm test` بزند.
    # این ناهم‌خوانی باید *دیده* شود، نه حدس زده — و همین ماتریس جای دیدنش است.
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']

    defaults:
      run:
        working-directory: next-frontend

    env:
      # تلهمتریِ Next در CI بی‌فایده است و فقط لاگ را شلوغ می‌کند
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: next-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ---------- تست‌های فرانت‌اند ----------
      # این‌ها به بک‌اندِ زنده نیازی ندارند: هر مرزِ شبکه‌ای در خودِ آزمون جعل
      # می‌شود (getMe/getOrder و مسیریابِ Next) و زمان هم با تایمرِ جعلی جلو
      # می‌رود. پس عمداً *قبل* از بالا‌آوردنِ بک‌اند می‌آید تا اگر رفتاری شکسته
      # شده باشد، در چند ثانیه معلوم شود نه بعد از کلِ بیلد.
      #
      # تنها آزمونِ خودکارِ رفتارِ زمان‌محورِ این پروژه همین است: حلقه‌ی
      # پیگیریِ نتیجه‌ی پرداخت ۳۴ دقیقه‌ای است و هیچ typecheck یا lintی نمی‌تواند
      # بفهمد ریتمِ ۱۵/۶۰ ثانیه‌ای یا سقفِ بررسی عوض شده.
      - name: Tests
        run: npm test

      # عددهای فرانت‌اند در README با *نتیجه‌ی اجرا* سنجیده می‌شوند، نه با شمارشِ
      # `it(` در فایل (که با `it.each` و `describe` اشتباه می‌شود). عددِ کل، عددِ هر
      # فایل، و نام‌بردنِ هر فایلِ آزمون — تا افزودنِ یک تست بی‌سروصدا مستندات را
      # از واقعیت جدا نکند.
      - name: README counts (frontend)
        run: npm run test:readme-counts

      # همان هارنسِ تخریبی، این بار روی نگهبان‌های Vitest و اسکریپتِ عددهای
      # README: فایلِ منبعِ محافظت‌شده عمداً شکسته می‌شود و باید *همان* آزمونِ
      # مشخص قرمز شود (گزارشِ JSON خوانده می‌شود، نه فقط کدِ خروج). بک‌اند لازم
      # نیست؛ فقط vitestِ نصب‌شده و خودِ مخزن.
      - name: Guard mutation harness (frontend guards)
        run: node ../backend/tests/guard-mutations.js --scope=frontend

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # ---------- بیلد، با بک‌اندِ زنده ----------
      # چرا بک‌اند را بالا می‌آوریم: `product/[id]/page.tsx` محصولات را در
      # زمانِ build پیش‌رندر می‌کند (`generateStaticParams`). بدونِ بک‌اند،
      # بیلد عمداً نمی‌شکند (خطای API قورت داده می‌شود) ولی **صفر** صفحه‌ی
      # محصول می‌سازد — یعنی یک بیلدِ سبزِ توخالی. اینجا همان مسیرِ production
      # اجرا می‌شود و بعد تعدادِ صفحه‌های ساخته‌شده واقعاً شمرده می‌شود.
      #
      # همه‌چیز در یک step است تا پروسه‌ی بک‌اند قطعاً تا آخرِ بیلد زنده بماند؛
      # اگر به stepِ بعد سپرده شود، به رفتارِ runner در زنده‌نگه‌داشتنِ پروسه‌های
      # پس‌زمینه گره می‌خورد.
      - name: Build against a live backend
        run: |
          set -euo pipefail

          # بک‌اند روی پورتِ پیش‌فرض (۳۰۰۰) بالا می‌آید و دیتابیس را از صفر
          # می‌سازد؛ `lib/seed.js` محصولات را می‌کارد. بدونِ این، سرور فقط
          # می‌گوید «بالا آمدم» ولی چیزی برای پیش‌رندر کردن وجود ندارد.
          ( cd ../backend && node server.js > /tmp/backend.log 2>&1 & )

          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1 && break
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
            echo '::error::backend never became healthy'
            cat /tmp/backend.log
            exit 1
          fi

          echo "backend is healthy; products visible:"
          curl -fsS 'http://127.0.0.1:3000/api/products?limit=1' | head -c 200
          echo

          npm run build

          # گاردِ واقعی: بیلدِ سبز با صفر صفحه‌ی محصول یعنی SSG کار نکرده.
          prerendered=$(find .next/server/app/product -name '*.html' 2>/dev/null | wc -l)
          echo "prerendered product pages: $prerendered"
          if [ "$prerendered" -lt 1 ]; then
            echo '::error::no product pages were prerendered - the SSG path is broken'
            exit 1
          fi

      # ---------- برابریِ زنده، با جهش ----------
      # اجراکننده‌ی زنده سرورِ واقعی می‌خواهد؛ بک‌اند ممکن است از stepِ بیلد زنده
      # مانده باشد و اگر نه خودمان بالا می‌آوریم. Next هم با `next start` روی همان
      # بیلدی که همین حالا ساخته شد بالا می‌آید. بعد هارنس یک خرابیِ عمدی در متنِ
      # Express می‌سازد و انتظار دارد اجراکننده «واگراییِ تازه» ببیند و قرمز شود.
      - name: Live parity guard mutations
        run: |
          set -euo pipefail

          if ! curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
            ( cd ../backend && node server.js > /tmp/backend-parity.log 2>&1 & )
          fi
          if ! curl -fsS http://127.0.0.1:3001/ > /dev/null 2>&1; then
            ( npm run start > /tmp/next-parity.log 2>&1 & )
          fi

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:3001/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          node ../backend/tests/guard-mutations.js --scope=live
