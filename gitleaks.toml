title = "Polasco Goli secret scanning"

[extend]
useDefault = true

# فقط خروجی‌های تولیدشده و فایل‌های داده‌ی محلی نادیده گرفته می‌شوند.
# فایل‌های محیطی واقعی عمداً نادیده گرفته نمی‌شوند تا اگر اشتباهاً track شدند،
# اسکن آن را گزارش کند.
#
# `next-frontend/.next/` هم خروجیِ ساخت است و هر `next build` از نو می‌سازدش؛
# بدونِ این خط، حالتِ `--worktree` نُه یافته‌ی کاذبِ base64 از manifestهایش
# برمی‌گرداند و آن سیلیِ نویز، یافته‌ی واقعیِ کنارش را هم بی‌اعتبار می‌کند.
#
# دو چیز را عمداً این‌جا نمی‌آوریم:
#   • `backend/.env` و `backup/**` — رازِ واقعیِ همین دستگاه. پوشاندنشان یعنی
#     «پاک» اعلام‌کردنِ همان چیزی که می‌خواهیم ببینیم.
#   • `backend/tests/**` — همان‌جایی که یافته‌های *بررسی‌شده‌ی* تاریخچه‌اند، ولی
#     هر مسیر یا الگویی که اینجا بیاید عام است و هر یافتهٔ تازهٔ همان فایل را هم
#     بی‌صدا می‌بلعد. آن‌ها جایشان `.gitleaksignore` است، خط‌به‌خط و با دلیل
#     (اثرِ انگشتِ خودشان از خروجیِ `tools/gitleaks.js` برداشته می‌شود).
[allowlist]
description = "Generated local data and tool metadata"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)backend/data/''',
  '''(^|/)backend/logs/''',
  '''(^|/)\.freebuff/''',
  '''(^|/)next-frontend/\.next/'''
]
commits = []
regexes = []
stopwords = []
