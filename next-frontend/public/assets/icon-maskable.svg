<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    آیکون maskable برای اندروید/PWA.
    فرق مهمش با favicon: اندروید آیکون را داخل شکل دلخواه خودش (دایره، قطره،
    مربع گرد) برش می‌زند و تا ۲۰٪ از هر طرف ممکن است حذف شود. پس:
      ۱) پس‌زمینه تمام‌قد است، نه کاشیِ گردِ وسط — وگرنه گوشه‌ها سفید در می‌آید.
      ۲) نشانه فقط داخل «ناحیه‌ی امن» (دایره‌ی وسط با شعاع ۴۰٪) کشیده شده.
    قبلاً همین favicon.svg به‌عنوان maskable معرفی شده بود؛ یعنی روی گوشیِ
    اندرویدی، لبه‌های کاشی و بخشی از تشت بریده می‌شد.
  -->
  <rect width="512" height="512" fill="#0B1411"/>
  <!-- مقیاس ۶٫۸: نشانه حدود نیمی از پهنا را می‌گیرد و همچنان کاملاً داخل
       دایره‌ی امن (قطر ۸۰٪) می‌ماند، حتی اگر اندروید گردترین ماسکش را بزند. -->
  <g transform="translate(256 262) scale(6.8) translate(-24 -21)">
    <path d="M3 12 L9 34c1.2 5.5 28.8 5.5 30 0 L45 12" fill="none" stroke="#FF6A4D" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="24" cy="12" rx="21" ry="7" fill="#FF6A4D"/>
    <ellipse cx="24" cy="12" rx="21" ry="7" fill="none" stroke="#EDF6F1" stroke-width="2.5"/>
    <ellipse cx="24" cy="11" rx="14" ry="4" fill="#E8503A" opacity=".55"/>
  </g>
</svg>
